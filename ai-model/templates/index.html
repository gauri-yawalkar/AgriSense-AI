<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro AI - Leaf Disease Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --bg-color: #020617;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(34, 197, 94, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.1), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            background: linear-gradient(to right, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .glass-panel {
                grid-template-columns: 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
            display: block;
            margin-bottom: 0.5rem;
        }

        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(34, 197, 94, 0.05);
        }

        .upload-area p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #file-input {
            display: none;
        }

        .preview-container {
            width: 100%;
            min-height: 300px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            align-items: center;
            justify-items: center;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }

        .result-item img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .result-item h4 {
            margin: 0;
            color: var(--text);
            font-size: 1rem;
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            grid-column: 1 / -1;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Pathology Diagnostics</h1>
            <p class="subtitle">Select a neural model and upload an image for immediate analysis</p>
        </header>

        <div class="glass-panel">
            <div class="control-group">
                <div>
                    <label>Upload Sample Image</label>
                    <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
                        <p>Click to browse or drag and drop image here</p>
                        <p style="font-size: 0.8rem; margin-top: 0.5rem;">Supports JPG, PNG</p>
                    </div>
                    <input type="file" id="file-input" accept="image/*">
                </div>

                <button id="analyze-btn" disabled>
                    <span class="btn-text">Run Analysis</span>
                    <div class="loader"></div>
                </button>
            </div>

            <div class="result-section">
                <h3 class="result-title">Analysis Results</h3>
                <div class="preview-container" id="preview-container">
                    <span class="empty-state" id="empty-state">No image uploaded yet.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const previewContainer = document.getElementById('preview-container');
        const emptyState = document.getElementById('empty-state');
        const btnText = document.querySelector('.btn-text');
        const loader = document.querySelector('.loader');

        let selectedFile = null;


        // Handle Drag and Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // Handle File Input Change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file.');
                return;
            }
            selectedFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                // Clear previous results, show original image
                previewContainer.innerHTML = `
                    <div class="result-item">
                        <h4>Original Image</h4>
                        <img src="${e.target.result}" alt="Original">
                    </div>
                `;
            };
            reader.readAsDataURL(file);

            analyzeBtn.disabled = false;
        }

        // Handle Analyze Button Click
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            // UI Loading state
            analyzeBtn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';
            
            // Keep original image, add loading text
            const originalImageHTML = previewContainer.innerHTML;
            previewContainer.innerHTML = originalImageHTML + '<span class="empty-state" style="margin-top: 1rem;">Analyzing with all models...</span>';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Re-render results
                    previewContainer.innerHTML = originalImageHTML;
                    
                    for (const [modelName, base64Image] of Object.entries(data.images)) {
                        previewContainer.innerHTML += `
                            <div class="result-item">
                                <h4>${modelName}</h4>
                                <img src="data:image/jpeg;base64,${base64Image}" alt="${modelName} Result">
                            </div>
                        `;
                    }
                    
                    if (data.errors && Object.keys(data.errors).length > 0) {
                        for (const [modelName, errorMsg] of Object.entries(data.errors)) {
                            previewContainer.innerHTML += `
                                <div class="result-item" style="border: 1px solid #ef4444; border-radius: 8px; padding: 1rem; background: rgba(239, 68, 68, 0.1);">
                                    <h4 style="color: #ef4444;">${modelName} (Error)</h4>
                                    <p style="font-size: 0.8rem; color: var(--text-muted); word-break: break-all;">Failed to run model.</p>
                                </div>
                            `;
                        }
                    }
                } else {
                    previewContainer.innerHTML = originalImageHTML;
                    alert('Error: ' + (data.error || 'Failed to process image'));
                }
            } catch (err) {
                alert('Network error occurred.');
                console.error(err);
            } finally {
                // UI Reset state
                analyzeBtn.disabled = false;
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
